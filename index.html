<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }

  :root {
    --gold: #ffd700;
    --gold-2: #ff9900;
    --purple: #9b59b6;
    --pink: #ff69b4;
    --bg: #06030f;
  }

  html, body { overflow-x:hidden; scroll-behavior: smooth; }

  body {
    background:
      radial-gradient(ellipse at top left, rgba(155,89,182,0.28), transparent 50%),
      radial-gradient(ellipse at top right, rgba(255,215,0,0.14), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(255,0,128,0.12), transparent 60%),
      var(--bg);
    color:#fff;
    min-height:100vh;
    position:relative;
  }

  /* نجوم متحركة في الخلفية */
  body::before {
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,215,0,0.7), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 80% 20%, rgba(155,89,182,0.8), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(255,215,0,0.6), transparent),
      radial-gradient(1px 1px at 15% 55%, rgba(255,105,180,0.6), transparent),
      radial-gradient(1.5px 1.5px at 70% 90%, rgba(155,89,182,0.7), transparent);
    background-size: 600px 600px;
    animation: starsMove 80s linear infinite;
    pointer-events:none;
    z-index:0;
  }

  @keyframes starsMove {
    to { background-position: 600px 600px; }
  }

  /* ========== الهيدر ========== */
  header {
    position:relative;
    z-index:2;
    text-align:center;
    padding:40px 20px 30px;
    background: linear-gradient(180deg, rgba(155,89,182,0.2), transparent);
    border-bottom: 1px solid rgba(255,215,0,0.15);
  }

  /* صورة البروفايل المدورة اللي بتلف */
  .avatar-wrapper {
    display:inline-block;
    position:relative;
    margin-bottom:18px;
  }

  .avatar-wrapper::before {
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    background: conic-gradient(#ffd700, #ff9900, #ff69b4, #9b59b6, #ffd700);
    animation: rotateBorder 4s linear infinite;
    z-index:-1;
    filter: blur(6px);
    opacity:0.85;
  }

  .avatar-wrapper::after {
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background: conic-gradient(#ffd700, #ff9900, #ff69b4, #9b59b6, #ffd700);
    animation: rotateBorder 4s linear infinite;
    z-index:-1;
  }

  @keyframes rotateBorder {
    to { transform: rotate(360deg); }
  }

  .avatar {
    width: 130px;
    height: 130px;
    border-radius:50%;
    object-fit: cover;
    border: 3px solid var(--bg);
    display:block;
    background: #1a0b2e;
    animation: floatY 3s ease-in-out infinite;
  }

  @keyframes floatY {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }

  .owner-name {
    font-size: clamp(28px, 5.5vw, 56px);
    font-weight:900;
    background: linear-gradient(90deg, #ffd700, #fff8b0, #ffb700, #ff69b4, #9b59b6, #ffd700);
    background-size: 400% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shine 4s linear infinite;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.6));
    letter-spacing: 2px;
    line-height: 1.2;
  }

  @keyframes shine { to { background-position:400% center; } }

  .glow-symbol {
    display:inline-block;
    color: #ffd700;
    -webkit-text-fill-color: #ffd700;
    animation: pulse 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 15px #ffd700);
  }

  @keyframes pulse {
    0%,100% { transform:scale(1); filter:drop-shadow(0 0 10px #ffd700); }
    50%     { transform:scale(1.2); filter:drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 40px #ff9900); }
  }

  .tagline {
    margin-top:12px;
    font-size:15px;
    color:#c9b3ff;
    letter-spacing:1px;
  }

  .dev-bar {
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
    padding:10px 24px;
    border-radius:50px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(255,215,0,0.35);
    box-shadow: 0 0 25px rgba(255,215,0,0.2) inset, 0 0 15px rgba(255,215,0,0.1);
    transition:.3s;
    cursor:pointer;
    text-decoration:none;
  }

  .dev-bar:hover { transform:translateY(-3px); box-shadow:0 0 35px rgba(255,215,0,0.5) inset; }

  .dev-bar .label { color:#aaa; font-size:13px; }

  .dev-bar .dev-user {
    font-weight:900;
    font-size:17px;
    color:#ffd700;
    text-decoration:none;
    animation: devGlow 1.6s ease-in-out infinite alternate;
  }

  @keyframes devGlow {
    from { text-shadow:0 0 8px rgba(255,215,0,0.6); }
    to   { text-shadow:0 0 20px rgba(255,215,0,1), 0 0 35px rgba(255,153,0,0.8); }
  }

  /* ========== إحصائيات ========== */
  .stats-bar {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap: 25px;
    margin-top: 25px;
    padding: 0 20px;
  }

  .stat-item {
    text-align:center;
  }

  .stat-item .num {
    font-size:22px;
    font-weight:900;
    color:#ffd700;
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
  }

  .stat-item .lbl {
    font-size:12px;
    color:#a990d4;
    margin-top:3px;
  }

  /* ========== شريط البحث ========== */
  .search-wrap {
    max-width:780px;
    margin: 35px auto 15px;
    padding:0 20px;
    display:flex;
    gap:10px;
    position:relative;
    z-index:2;
  }

  .search-wrap input {
    flex:1;
    padding:16px 22px;
    border-radius:16px;
    border:1px solid rgba(255,215,0,0.25);
    background: rgba(255,255,255,0.05);
    color:#fff;
    font-size:15px;
    outline:none;
    transition:.3s;
    backdrop-filter: blur(10px);
  }

  .search-wrap input::placeholder { color:#8a7ab8; }

  .search-wrap input:focus {
    border-color:#ffd700;
    box-shadow: 0 0 25px rgba(255,215,0,0.4);
    background: rgba(255,255,255,0.09);
  }

  .search-wrap button {
    padding:16px 32px;
    border:none;
    border-radius:16px;
    background: linear-gradient(135deg, #ffd700, #ff9900);
    color:#1a0b2e;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
  }

  .search-wrap button:hover {
    transform:translateY(-2px) scale(1.03);
    box-shadow: 0 10px 30px rgba(255,215,0,0.6);
  }

  /* ========== التبويبات ========== */
  .tabs {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin: 30px auto;
    padding: 0 20px;
    max-width: 1000px;
    position:relative;
    z-index:2;
  }

  .tab {
    padding: 14px 32px;
    border-radius: 40px;
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,215,0,0.2);
    color:#ddd;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.35s;
    position:relative;
    overflow:hidden;
  }

  .tab::before {
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(135deg, #ffd700, #ff9900);
    opacity:0;
    transition:.35s;
    z-index:-1;
  }

  .tab:hover {
    color:#ffd700;
    transform:translateY(-3px);
    border-color:#ffd700;
    box-shadow: 0 8px 25px rgba(255,215,0,0.3);
  }

  .tab.active {
    color:#1a0b2e;
    border-color:transparent;
    box-shadow: 0 0 30px rgba(255,215,0,0.7), 0 0 60px rgba(255,215,0,0.3);
    transform:translateY(-3px);
  }

  .tab.active::before { opacity:1; }

  /* ========== عنوان القسم ========== */
  .section-title {
    text-align:center;
    max-width:1400px;
    margin: 20px auto 0;
    padding: 0 30px;
    font-size: 22px;
    font-weight:900;
    color:#ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
    position:relative;
    z-index:2;
  }

  .section-title span {
    display:inline-block;
    padding: 8px 30px;
    border-bottom: 3px solid #ffd700;
    border-radius: 8px;
  }

  /* ========== شبكة المحتوى ========== */
  .content-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap:22px;
    padding: 25px 30px 40px;
    max-width:1400px;
    margin: 0 auto;
    position:relative;
    z-index:2;
  }

  .card {
    background: rgba(255,255,255,0.03);
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:.4s cubic-bezier(.25,.8,.25,1);
    border:1px solid rgba(255,255,255,0.06);
    position:relative;
    backdrop-filter: blur(8px);
  }

  .card::after {
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.9));
    pointer-events:none;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: rgba(255,215,0,0.6);
    box-shadow: 0 20px 40px rgba(255,215,0,0.3), 0 0 30px rgba(155,89,182,0.3);
  }

  .card img {
    width:100%;
    height: 270px;
    object-fit:cover;
    display:block;
    transition:.5s;
  }

  .card:hover img { transform: scale(1.1); }

  .card-info {
    padding: 12px;
    position:relative;
    z-index:2;
    margin-top:-55px;
  }

  .card-info h3 {
    font-size:14px;
    font-weight:700;
    color:#fff;
    margin-bottom:6px;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    text-shadow:0 2px 8px #000;
  }

  .card-info .meta {
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#e0d5ff;
  }

  .card-info .rating { color:#ffd700; font-weight:900; }

  /* ========== الحالة ========== */
  .status {
    text-align:center;
    padding: 80px 20px;
    font-size:16px;
    color:#b39ddb;
    grid-column: 1/-1;
  }

  .loader {
    display:inline-block;
    width:50px;
    height:50px;
    border:4px solid rgba(255,215,0,0.15);
    border-top-color:#ffd700;
    border-radius:50%;
    animation: spin 1s linear infinite;
    margin-bottom:18px;
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== زر تحميل المزيد ========== */
  .load-more-wrap {
    text-align:center;
    padding: 0 20px 60px;
    position:relative;
    z-index:2;
  }

  .load-more {
    padding: 14px 45px;
    border-radius:40px;
    border:2px solid #ffd700;
    background: transparent;
    color:#ffd700;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    transition:.35s;
    font-family:inherit;
  }

  .load-more:hover {
    background: linear-gradient(135deg, #ffd700, #ff9900);
    color:#1a0b2e;
    box-shadow: 0 0 35px rgba(255,215,0,0.6);
    transform:translateY(-2px);
  }

  .load-more:disabled {
    opacity:0.5;
    cursor:not-allowed;
    border-color:#666;
    color:#666;
  }

  /* ========== زر العودة للأعلى ========== */
  .to-top {
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700, #ff9900);
    color: #1a0b2e;
    border: none;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,215,0,0.5);
    opacity: 0;
    visibility: hidden;
    transition: .4s;
    z-index: 999;
  }

  .to-top.show { opacity: 1; visibility: visible; }
  .to-top:hover { transform: translateY(-5px) scale(1.1); }

  /* ========== الفوتر ========== */
  footer {
    text-align:center;
    padding: 35px 20px;
    border-top: 1px solid rgba(255,215,0,0.12);
    color:#888;
    font-size:13px;
    position:relative;
    z-index:2;
  }

  footer .dev { color:#ffd700; font-weight:900; text-shadow:0 0 10px rgba(255,215,0,0.6); }

  /* ========== نافذة التفاصيل ========== */
  .modal {
    display:none;
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.92);
    z-index:1000;
    overflow-y:auto;
    padding: 30px 15px;
    backdrop-filter: blur(8px);
  }

  .modal.active { display:block; animation: fadeIn .3s ease; }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .modal-content {
    max-width: 850px;
    margin: 20px auto;
    background: linear-gradient(180deg, #1a0b2e, #0a0416);
    border-radius: 22px;
    padding: 30px;
    border:1px solid rgba(255,215,0,0.3);
    box-shadow: 0 0 60px rgba(255,215,0,0.25);
    position:relative;
    animation: slideUp .4s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(40px); opacity:0; }
    to   { transform: translateY(0); opacity:1; }
  }

  .modal-close {
    position:absolute;
    top:18px;
    left:18px;
    background: rgba(255,0,0,0.15);
    color:#ff6b6b;
    border:1px solid rgba(255,107,107,0.4);
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    z-index:5;
  }

  .modal-close:hover { background: rgba(255,0,0,0.35); transform: rotate(90deg); }

  .modal-content img.poster {
    width: 220px;
    border-radius:16px;
    float:right;
    margin: 0 0 18px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(255,215,0,0.3);
  }

  .modal-content h2 {
    color:#ffd700;
    margin-bottom:12px;
    font-size:24px;
    text-shadow:0 0 20px rgba(255,215,0,0.4);
  }

  .modal-content .story {
    color:#ccc;
    line-height:1.9;
    margin: 18px 0;
    clear:both;
    font-size:14px;
  }

  .modal-content .servers { margin-top: 25px; clear:both; }

  .modal-content .servers h3 {
    color:#ffd700;
    margin-bottom:14px;
    font-size:17px;
  }

  .server-btn {
    display:inline-block;
    margin: 6px 6px 0 0;
    padding: 11px 22px;
    border-radius:12px;
    background: linear-gradient(135deg, #ffd700, #ff9900);
    color:#1a0b2e;
    text-decoration:none;
    font-weight:900;
    font-size:13px;
    transition:.3s;
    box-shadow: 0 5px 15px rgba(255,215,0,0.35);
  }

  .server-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 28px rgba(255,215,0,0.7);
  }

  @media (max-width:600px) {
    .modal-content img.poster { float:none; display:block; margin:0 auto 18px; width:180px; }
    .search-wrap { flex-direction:column; }
    .tab { padding:11px 22px; font-size:14px; }
    .content-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:14px; padding:20px 15px 40px; }
    .card img { height:210px; }
    .avatar { width: 100px; height: 100px; }
    .to-top { bottom: 20px; left: 20px; width: 48px; height: 48px; font-size: 18px; }
    .stats-bar { gap: 18px; }
  }

  /* شريط تمرير مخصص */
  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-track { background:#0a0416; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #ffd700, #ff9900);
    border-radius:10px;
  }
</style>
</head>

let isLoading = false;

/* ============================================================
   طلب عبر البروكسيات (يجرّب كل واحد بالترتيب)
   ============================================================ */
async function fetchViaProxy(url, options = {}) {
  let lastError = null;

  for (const proxy of PROXIES) {
    try {
      const targetUrl = proxy + encodeURIComponent(url);
      const res = await fetch(targetUrl, options);
      if (!res.ok) throw new Error("HTTP " + res.status);

      const text = await res.text();
      const json = JSON.parse(text);
      return json;
    } catch (err) {
      console.warn("Proxy failed:", proxy, err.message);
      lastError = err;
    }
  }

  throw new Error("فشل الاتصال بجميع السيرفرات، حاول تحديث الصفحة");
}

/* ============================================================
   جلب البيانات الرئيسي
   ============================================================ */
async function fetchData(url, params = {}) {
  const query = new URLSearchParams(params).toString();
  const fullUrl = query ? `${url}?${query}` : url;
  return await fetchViaProxy(fullUrl);
}

/* ============================================================
   تحميل المحتوى
   ============================================================ */
async function loadContent(type = "movies", page = 1, search = "", append = false) {
  if (isLoading) return;
  isLoading = true;

  const content = document.getElementById("content");
  const loadMoreBtn = document.getElementById("loadMoreBtn");

  if (!append) {
    content.innerHTML = `<div class="status"><div class="loader"></div><br>⏳ جاري تحميل ${TITLES[type]}...</div>`;
    loadMoreBtn.style.display = "none";
  } else {
    loadMoreBtn.textContent = "⏳ جاري التحميل...";
    loadMoreBtn.disabled = true;
  }

  try {
    let url;
    let params = { page, limit: 20, app_version: 15 };

    if (search) params.search = search;
    else params.sort_by = "most_viewed";

    if (type === "movies") url = ENDPOINTS.movies;
    else if (type === "series") url = ENDPOINTS.series;
    else if (type === "anime_movies") { url = ENDPOINTS.anime; params.anime_type = "movie"; }
    else if (type === "anime_series") { url = ENDPOINTS.anime; params.anime_type = "tv,ova,ona,special"; }

    const data = await fetchData(url, params);

    if (!data || data.status !== "success" || !Array.isArray(data.data) || data.data.length === 0) {
      if (!append) {
        content.innerHTML = `<div class="status">
          <div style="font-size:48px;margin-bottom:15px;">😕</div>
          لا توجد نتائج ${search ? `للبحث: "${search}"` : "حالياً"}
          <br><small style="color:#666;display:block;margin-top:10px;">جرّب تحديث الصفحة أو البحث باسم آخر</small>
        </div>`;
        loadMoreBtn.style.display = "none";
      } else {
        loadMoreBtn.textContent = "✅ لا يوجد المزيد";
        loadMoreBtn.disabled = true;
      }
      isLoading = false;
      return;
    }

    renderCards(data.data, append);

    if (data.data.length >= 15) {
      loadMoreBtn.style.display = "inline-block";
      loadMoreBtn.textContent = "📥 تحميل المزيد";
      loadMoreBtn.disabled = false;
    } else {
      loadMoreBtn.style.display = "none";
    }

  } catch (err) {
    console.error(err);
    if (!append) {
      content.innerHTML = `<div class="status">
        <div style="font-size:48px;margin-bottom:15px;">⚠️</div>
        حدث خطأ في التحميل
        <br><small style="color:#666;display:block;margin-top:10px;">${err.message}</small>
        <br><button onclick="retryLoad()" style="margin-top:20px;padding:10px 25px;border-radius:12px;border:none;background:linear-gradient(135deg,#ffd700,#ff9900);color:#1a0b2e;font-weight:900;cursor:pointer;font-family:inherit;">🔄 إعادة المحاولة</button>
      </div>`;
    } else {
      loadMoreBtn.textContent = "🔄 إعادة المحاولة";
      loadMoreBtn.disabled = false;
    }
  } finally {
    isLoading = false;
  }
}

function retryLoad() {
  loadContent(currentType, currentPage, currentSearch, false);
}

/* ============================================================
   عرض الكروت
   ============================================================ */
function renderCards(items, append = false) {
  const content = document.getElementById("content");
  if (!append) content.innerHTML = "";

  items.forEach(item => {
    const title = item.title_ar || item.title_en || "بدون عنوان";
    const year = item.release_year || "";
    const rating = item.rating || "N/A";
    let poster = item.poster
      ? (item.poster.startsWith("http") ? item.poster : API_BASE + item.poster)
      : "https://via.placeholder.com/300x450/1a0b2e/ffd700?text=No+Image";

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openDetails(item.id);

    card.innerHTML = `
      <img src="${poster}" alt="${title}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/300x450/1a0b2e/ffd700?text=No+Image'">
      <div class="card-info">
        <h3>${title}</h3>
        <div class="meta">
          <span>${year}</span>
          <span class="rating">⭐ ${rating}</span>
        </div>
      </div>
    `;
    content.appendChild(card);
  });
}

/* ============================================================
   تحميل المزيد
   ============================================================ */
function loadMore() {
  if (isLoading) return;
  currentPage++;
  loadContent(currentType, currentPage, currentSearch, true);
}

/* ============================================================
   فتح التفاصيل
   ============================================================ */
async function openDetails(id) {
  const modal = document.getElementById("modal");
  const modalContent = document.getElementById("modalContent");
  modal.classList.add("active");
  modalContent.innerHTML = `<div class="status"><div class="loader"></div><br>⏳ جاري تحميل التفاصيل...</div>`;
  document.body.style.overflow = "hidden";

  let showUrl;
  if (currentType === "movies") showUrl = ENDPOINTS.movies_show;
  else if (currentType === "series") showUrl = ENDPOINTS.series_show;
  else showUrl = ENDPOINTS.anime_show;

  try {
    const data = await fetchData(showUrl, { id });

    if (!data || data.status !== "success" || !data.data) {
      modalContent.innerHTML = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="status">❌ تعذر تحميل التفاصيل</div>
      `;
      return;
    }

    const item = data.data;
    const title = item.title_ar || item.title_en || "بدون عنوان";
    const story = item.story || "لا توجد قصة متاحة.";
    const year = item.release_year || "";
    const rating = item.rating || "N/A";
    const poster = item.poster
      ? (item.poster.startsWith("http") ? item.poster : API_BASE + item.poster)
      : "https://via.placeholder.com/300x450/1a0b2e/ffd700?text=No+Image";

    const watchLinks = item.watch_links || [];
    let serversHtml = "";
    watchLinks.forEach(link => {
      if (link.url) {
        serversHtml += `<a class="server-btn" href="${link.url}" target="_blank" rel="noopener">
          ▶️ ${link.quality || ""} - ${link.server_name || "سيرفر"}
        </a>`;
      }
    });

    modalContent.innerHTML = `
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img class="poster" src="${poster}" alt="${title}"
           onerror="this.src='https://via.placeholder.com/300x450/1a0b2e/ffd700?text=No+Image'">
      <h2>${title}</h2>
      <p style="color:#b39ddb;font-size:14px;">📅 ${year} • ⭐ ${rating}</p>
      <div class="story">${story}</div>
      <div class="servers">
        <h3>🎬 روابط المشاهدة:</h3>
        ${serversHtml || '<p style="color:#888;">لا توجد روابط متاحة حالياً</p>'}
      </div>
    `;
  } catch (err) {
    modalContent.innerHTML = `
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="status">❌ خطأ: ${err.message}</div>
    `;
  }
}

function closeModal() {
  document.getElementById("modal").classList.remove("active");
  document.body.style.overflow = "auto";
}

/* ============================================================
   التبويبات
   ============================================================ */
function switchTab(el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  currentType = el.dataset.type;
  currentPage = 1;
  currentSearch = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("sectionTitle").innerHTML = `<span>${TITLES[currentType]}</span>`;
  loadContent(currentType, 1, "");
  window.scrollTo({ top: 300, behavior: "smooth" });
}

/* ============================================================
   البحث
   ============================================================ */
function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  currentSearch = q;
  currentPage = 1;
  if (!q) {
    document.getElementById("sectionTitle").innerHTML = `<span>${TITLES[currentType]}</span>`;
    loadContent(currentType, 1, "");
    return;
  }
  document.getElementById("sectionTitle").innerHTML = `<span>🔍 نتائج البحث: "${q}"</span>`;
  loadContent(currentType, 1, q);
  window.scrollTo({ top: 300, behavior: "smooth" });
}

document.getElementById("searchInput").addEventListener("keypress", e => {
  if (e.key === "Enter") doSearch();
});

/* ============================================================
   إغلاق عند الضغط خارج النافذة
   ============================================================ */
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

/* ============================================================
   زر العودة للأعلى
   ============================================================ */
window.addEventListener("scroll", () => {
  const btn = document.getElementById("toTop");
  if (window.scrollY > 500) btn.classList.add("show");
  else btn.classList.remove("show");
});

/* ============================================================
   التشغيل
   ============================================================ */
window.addEventListener("DOMContentLoaded", () => {
  loadContent("movies", 1);
});
</script>
